name: Test git diff against HEAD^1
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user and create a commit with changes
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a new file and commit it so HEAD^1 exists and there's a diff
          echo "test content for diff" > /tmp/test-diff-file.txt
          cp /tmp/test-diff-file.txt "$GITHUB_WORKSPACE/test-diff-file.txt"
          git add "$GITHUB_WORKSPACE/test-diff-file.txt"
          git commit -m "Add test file for diff"

      - id: action
        uses: .
        with:
          base_branch: HEAD^1

      - name: Assert json-diff output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected json-diff output to be non-empty"
            exit 1
          fi
          echo "PASS: json-diff output is present"

      - name: Assert json-diff contains the changed file
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q 'test-diff-file.txt'; then
            echo "FAIL: expected json-diff to reference 'test-diff-file.txt'"
            exit 1
          fi
          echo "PASS: json-diff references the changed file"

      - name: Assert raw-diff output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.raw-diff }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected raw-diff output to be non-empty"
            exit 1
          fi
          echo "PASS: raw-diff output is present"

      - name: Clean up test file
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/test-diff-file.txt"
