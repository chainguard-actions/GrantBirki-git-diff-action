name: Test file output (json and raw diff written to files)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          git_diff_file: "${{ github.workspace }}/tests/fixtures/sample.diff"
          json_diff_file_output: "/tmp/diff-output.json"
          raw_diff_file_output: "/tmp/diff-output.raw"

      - name: Assert json-diff-path output
        env:
          JSON_PATH: ${{ steps.action.outputs.json-diff-path }}
        run: |
          echo "json-diff-path: $JSON_PATH"
          if [ "$JSON_PATH" != "/tmp/diff-output.json" ]; then
            echo "FAIL: expected json-diff-path to be '/tmp/diff-output.json', got '$JSON_PATH'"
            exit 1
          fi
          echo "PASS: json-diff-path is correct"

      - name: Assert raw-diff-path output
        env:
          RAW_PATH: ${{ steps.action.outputs.raw-diff-path }}
        run: |
          echo "raw-diff-path: $RAW_PATH"
          if [ "$RAW_PATH" != "/tmp/diff-output.raw" ]; then
            echo "FAIL: expected raw-diff-path to be '/tmp/diff-output.raw', got '$RAW_PATH'"
            exit 1
          fi
          echo "PASS: raw-diff-path is correct"

      - name: Assert JSON diff file exists and is valid JSON
        run: |
          if [ ! -f "/tmp/diff-output.json" ]; then
            echo "FAIL: /tmp/diff-output.json does not exist"
            exit 1
          fi
          python3 -m json.tool /tmp/diff-output.json > /dev/null || { echo "FAIL: /tmp/diff-output.json is not valid JSON"; exit 1; }
          echo "PASS: JSON diff file exists and is valid JSON"

      - name: Assert raw diff file exists and is non-empty
        run: |
          if [ ! -f "/tmp/diff-output.raw" ]; then
            echo "FAIL: /tmp/diff-output.raw does not exist"
            exit 1
          fi
          if [ ! -s "/tmp/diff-output.raw" ]; then
            echo "FAIL: /tmp/diff-output.raw is empty"
            exit 1
          fi
          echo "PASS: raw diff file exists and is non-empty"
