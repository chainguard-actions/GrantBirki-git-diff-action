name: Test file output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a commit to diff against
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "file output test content" > test-file-output.txt
          git add test-file-output.txt
          git commit -m "Add test-file-output.txt"

      - id: action
        uses: .
        with:
          base_branch: HEAD^1
          json_diff_file_output: /tmp/diff-output.json
          raw_diff_file_output: /tmp/diff-output.txt

      - name: Assert json-diff-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff-path }}
        run: |
          echo "actual json-diff-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected json-diff-path to be non-empty"
            exit 1
          fi
          echo "PASS: json-diff-path is set to: $ACTUAL"

      - name: Assert raw-diff-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.raw-diff-path }}
        run: |
          echo "actual raw-diff-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected raw-diff-path to be non-empty"
            exit 1
          fi
          echo "PASS: raw-diff-path is set to: $ACTUAL"

      - name: Assert JSON diff file exists and has content
        run: |
          echo "Checking /tmp/diff-output.json"
          if [ ! -f /tmp/diff-output.json ]; then
            echo "FAIL: /tmp/diff-output.json does not exist"
            exit 1
          fi
          CONTENT=$(cat /tmp/diff-output.json)
          echo "content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: /tmp/diff-output.json is empty"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "test-file-output"; then
            echo "FAIL: JSON diff file does not contain 'test-file-output'"
            exit 1
          fi
          echo "PASS: JSON diff file exists and contains expected content"

      - name: Assert raw diff file exists and has content
        run: |
          echo "Checking /tmp/diff-output.txt"
          if [ ! -f /tmp/diff-output.txt ]; then
            echo "FAIL: /tmp/diff-output.txt does not exist"
            exit 1
          fi
          CONTENT=$(cat /tmp/diff-output.txt)
          echo "content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: /tmp/diff-output.txt is empty"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "test-file-output"; then
            echo "FAIL: raw diff file does not contain 'test-file-output'"
            exit 1
          fi
          echo "PASS: raw diff file exists and contains expected content"
