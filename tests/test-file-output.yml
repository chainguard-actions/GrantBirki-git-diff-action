name: Test file output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a commit to diff against
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "file output test content" > file-output-test.txt
          git add file-output-test.txt
          git commit -m "Add file-output-test.txt"

      - id: action
        uses: .
        with:
          base_branch: HEAD^1
          json_diff_file_output: /tmp/diff-output.json
          raw_diff_file_output: /tmp/diff-output.raw

      - name: Assert json-diff-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff-path }}
        run: |
          echo "actual json-diff-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: json-diff-path output is empty"
            exit 1
          fi
          echo "PASS: json-diff-path is set to $ACTUAL"

      - name: Assert raw-diff-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.raw-diff-path }}
        run: |
          echo "actual raw-diff-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: raw-diff-path output is empty"
            exit 1
          fi
          echo "PASS: raw-diff-path is set to $ACTUAL"

      - name: Assert JSON diff file exists and has content
        run: |
          if [ ! -f "/tmp/diff-output.json" ]; then
            echo "FAIL: JSON diff file does not exist at /tmp/diff-output.json"
            exit 1
          fi
          CONTENT=$(cat /tmp/diff-output.json)
          echo "JSON diff file content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: JSON diff file is empty"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "file-output-test.txt"; then
            echo "FAIL: JSON diff file does not mention file-output-test.txt"
            exit 1
          fi
          echo "PASS: JSON diff file exists and contains expected content"

      - name: Assert raw diff file exists and has content
        run: |
          if [ ! -f "/tmp/diff-output.raw" ]; then
            echo "FAIL: raw diff file does not exist at /tmp/diff-output.raw"
            exit 1
          fi
          CONTENT=$(cat /tmp/diff-output.raw)
          echo "raw diff file content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: raw diff file is empty"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "file-output-test.txt"; then
            echo "FAIL: raw diff file does not mention file-output-test.txt"
            exit 1
          fi
          echo "PASS: raw diff file exists and contains expected content"
