name: Test file output options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample git diff file
        run: |
          cat > /tmp/sample-for-file-output.diff << 'EOF'
          diff --git a/bar.txt b/bar.txt
          index e69de29..d95f3ad 100644
          --- a/bar.txt
          +++ b/bar.txt
          @@ -0,0 +1,2 @@
          +line one
          +line two
          EOF

      - id: action
        uses: .
        with:
          git_diff_file: /tmp/sample-for-file-output.diff
          json_diff_file_output: /tmp/output-diff.json
          raw_diff_file_output: /tmp/output-diff.raw

      - name: Assert json-diff-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff-path }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/output-diff.json" ]; then
            echo "FAIL: expected json-diff-path to be '/tmp/output-diff.json', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: json-diff-path is correct"

      - name: Assert raw-diff-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.raw-diff-path }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/output-diff.raw" ]; then
            echo "FAIL: expected raw-diff-path to be '/tmp/output-diff.raw', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: raw-diff-path is correct"

      - name: Assert JSON diff file exists and is valid JSON
        run: |
          if [ ! -f /tmp/output-diff.json ]; then
            echo "FAIL: JSON diff file does not exist at /tmp/output-diff.json"
            exit 1
          fi
          echo "JSON file content:"
          cat /tmp/output-diff.json
          if ! cat /tmp/output-diff.json | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
            echo "FAIL: JSON diff file is not valid JSON"
            exit 1
          fi
          echo "PASS: JSON diff file exists and is valid JSON"

      - name: Assert raw diff file exists and is non-empty
        run: |
          if [ ! -f /tmp/output-diff.raw ]; then
            echo "FAIL: raw diff file does not exist at /tmp/output-diff.raw"
            exit 1
          fi
          echo "Raw file content:"
          cat /tmp/output-diff.raw
          if [ ! -s /tmp/output-diff.raw ]; then
            echo "FAIL: raw diff file is empty"
            exit 1
          fi
          echo "PASS: raw diff file exists and is non-empty"
