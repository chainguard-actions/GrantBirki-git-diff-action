name: Test file output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a file and commit it
        run: |
          echo "file output test content" > output-test-file.txt
          git add output-test-file.txt
          git commit -m "Add output test file"

      - id: action
        uses: .
        with:
          base_branch: HEAD^1
          json_diff_file_output: /tmp/diff-output.json
          raw_diff_file_output: /tmp/diff-output.raw

      - name: Assert json-diff-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff-path }}
        run: |
          echo "actual json-diff-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected json-diff-path to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert raw-diff-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.raw-diff-path }}
        run: |
          echo "actual raw-diff-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected raw-diff-path to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert JSON diff file exists and contains content
        run: |
          if [ ! -f "/tmp/diff-output.json" ]; then
            echo "FAIL: JSON diff file not found at /tmp/diff-output.json"
            exit 1
          fi
          CONTENT=$(cat /tmp/diff-output.json)
          echo "JSON diff file content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: JSON diff file is empty"
            exit 1
          fi
          if echo "$CONTENT" | grep -q "output-test-file.txt"; then
            echo "PASS: output-test-file.txt found in JSON diff file"
          else
            echo "FAIL: output-test-file.txt not found in JSON diff file"
            exit 1
          fi

      - name: Assert raw diff file exists and contains content
        run: |
          if [ ! -f "/tmp/diff-output.raw" ]; then
            echo "FAIL: raw diff file not found at /tmp/diff-output.raw"
            exit 1
          fi
          CONTENT=$(cat /tmp/diff-output.raw)
          echo "raw diff file content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: raw diff file is empty"
            exit 1
          fi
          if echo "$CONTENT" | grep -q "output-test-file.txt"; then
            echo "PASS: output-test-file.txt found in raw diff file"
          else
            echo "FAIL: output-test-file.txt not found in raw diff file"
            exit 1
          fi
