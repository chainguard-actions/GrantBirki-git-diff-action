name: Test reading diff from file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a sample diff file
        run: |
          cat > /tmp/sample.diff << 'EOF'
          diff --git a/sample.txt b/sample.txt
          new file mode 100644
          index 0000000..3b18e51
          --- /dev/null
          +++ b/sample.txt
          @@ -0,0 +1 @@
          +hello world
          EOF

      - id: action
        uses: .
        with:
          git_diff_file: /tmp/sample.diff

      - name: Assert json-diff is not empty
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual json-diff: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected json-diff to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert raw-diff is not empty
        env:
          ACTUAL: ${{ steps.action.outputs.raw-diff }}
        run: |
          echo "actual raw-diff: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected raw-diff to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert json-diff contains sample.txt
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "json-diff: $ACTUAL"
          if echo "$ACTUAL" | grep -q "sample.txt"; then
            echo "PASS: sample.txt found in json-diff"
          else
            echo "FAIL: sample.txt not found in json-diff"
            exit 1
          fi
