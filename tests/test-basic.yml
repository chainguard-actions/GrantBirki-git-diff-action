name: Test basic usage (read diff from file)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          git_diff_file: "${{ github.workspace }}/tests/fixtures/sample.diff"

      - name: Assert raw-diff is non-empty
        env:
          RAW_DIFF: ${{ steps.action.outputs.raw-diff }}
        run: |
          echo "raw-diff length: ${#RAW_DIFF}"
          if [ -z "$RAW_DIFF" ]; then
            echo "FAIL: raw-diff output is empty"
            exit 1
          fi
          echo "PASS: raw-diff is non-empty"

      - name: Assert json-diff is valid JSON
        env:
          JSON_DIFF: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "json-diff: $JSON_DIFF"
          if [ -z "$JSON_DIFF" ]; then
            echo "FAIL: json-diff output is empty"
            exit 1
          fi
          echo "$JSON_DIFF" | python3 -m json.tool > /dev/null || { echo "FAIL: json-diff is not valid JSON"; exit 1; }
          echo "PASS: json-diff is valid JSON"

      - name: Assert json-diff contains expected files
        env:
          JSON_DIFF: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "json-diff: $JSON_DIFF"
          # The fixture diff has 2 files changed
          FILE_COUNT=$(echo "$JSON_DIFF" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d['files']))")
          echo "file count: $FILE_COUNT"
          if [ "$FILE_COUNT" != "2" ]; then
            echo "FAIL: expected 2 files in json-diff, got $FILE_COUNT"
            exit 1
          fi
          echo "PASS: json-diff contains 2 files"
