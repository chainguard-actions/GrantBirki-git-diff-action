name: Test basic git diff output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user and create a commit to diff against
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a new file and commit it so HEAD^1 exists and differs from HEAD
          echo "hello world" > test-diff-file.txt
          git add test-diff-file.txt
          git commit -m "Add test-diff-file.txt for diff test"
          # Verify HEAD^1 exists
          git log --oneline -3
          echo "HEAD is: $(git rev-parse HEAD)"
          echo "HEAD^1 is: $(git rev-parse HEAD^1)"

      - id: action
        uses: .
        with:
          base_branch: HEAD^1

      - name: Assert json-diff is non-empty
        env:
          JSON_DIFF: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "json-diff: $JSON_DIFF"
          if [ -z "$JSON_DIFF" ]; then
            echo "FAIL: json-diff output is empty"
            exit 1
          fi
          echo "PASS: json-diff is non-empty"

      - name: Assert raw-diff is non-empty
        env:
          RAW_DIFF: ${{ steps.action.outputs.raw-diff }}
        run: |
          echo "raw-diff: $RAW_DIFF"
          if [ -z "$RAW_DIFF" ]; then
            echo "FAIL: raw-diff output is empty"
            exit 1
          fi
          echo "PASS: raw-diff is non-empty"

      - name: Assert json-diff contains the new file
        env:
          JSON_DIFF: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "json-diff: $JSON_DIFF"
          if ! echo "$JSON_DIFF" | grep -q "test-diff-file.txt"; then
            echo "FAIL: json-diff does not mention test-diff-file.txt"
            exit 1
          fi
          echo "PASS: json-diff contains test-diff-file.txt"
