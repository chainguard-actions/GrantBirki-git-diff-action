name: Test basic git diff
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a commit to diff against
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "hello world" > test-basic-file.txt
          git add test-basic-file.txt
          git commit -m "Add test-basic-file.txt"

      - id: action
        uses: .
        with:
          base_branch: HEAD^1

      - name: Assert raw-diff is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.raw-diff }}
        run: |
          echo "actual raw-diff: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected raw-diff to be non-empty"
            exit 1
          fi
          echo "PASS: raw-diff is non-empty"

      - name: Assert json-diff is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual json-diff: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected json-diff to be non-empty"
            exit 1
          fi
          echo "PASS: json-diff is non-empty"

      - name: Assert json-diff contains the test file
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual json-diff: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "test-basic-file"; then
            echo "FAIL: expected json-diff to contain 'test-basic-file'"
            exit 1
          fi
          echo "PASS: json-diff contains test-basic-file"

      - name: Assert raw-diff contains the test file
        env:
          ACTUAL: ${{ steps.action.outputs.raw-diff }}
        run: |
          echo "actual raw-diff: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "test-basic-file"; then
            echo "FAIL: expected raw-diff to contain 'test-basic-file'"
            exit 1
          fi
          echo "PASS: raw-diff contains test-basic-file"
