name: Test basic git diff output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a commit with a changed file
        run: |
          echo "hello world" > /tmp/testfile.txt
          cp /tmp/testfile.txt testfile_diff_test.txt
          git add testfile_diff_test.txt
          git commit -m "Add testfile for diff test"

      - name: Modify the file to create a diff
        run: |
          echo "hello world updated" > testfile_diff_test.txt
          git add testfile_diff_test.txt
          git commit -m "Update testfile for diff test"

      - id: action
        uses: .
        with:
          base_branch: HEAD^1

      - name: Assert json-diff is not empty
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual json-diff: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: json-diff output is empty"
            exit 1
          fi
          echo "PASS: json-diff is non-empty"

      - name: Assert raw-diff is not empty
        env:
          ACTUAL: ${{ steps.action.outputs.raw-diff }}
        run: |
          echo "actual raw-diff: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: raw-diff output is empty"
            exit 1
          fi
          echo "PASS: raw-diff is non-empty"

      - name: Assert json-diff contains expected file
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "json-diff: $ACTUAL"
          if echo "$ACTUAL" | grep -q "testfile_diff_test"; then
            echo "PASS: json-diff contains expected filename"
          else
            echo "FAIL: json-diff does not contain 'testfile_diff_test'"
            exit 1
          fi
