name: Test file_output_only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample git diff file
        run: |
          cat > /tmp/sample-file-only.diff << 'EOF'
          diff --git a/baz.txt b/baz.txt
          index e69de29..d95f3ad 100644
          --- a/baz.txt
          +++ b/baz.txt
          @@ -0,0 +1 @@
          +only in file
          EOF

      - id: action
        uses: .
        with:
          git_diff_file: /tmp/sample-file-only.diff
          file_output_only: 'true'
          json_diff_file_output: /tmp/file-only-output.json
          raw_diff_file_output: /tmp/file-only-output.raw

      - name: Assert json-diff step output is empty (file_output_only=true)
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected json-diff output to be empty when file_output_only=true, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: json-diff output is empty as expected"

      - name: Assert raw-diff step output is empty (file_output_only=true)
        env:
          ACTUAL: ${{ steps.action.outputs.raw-diff }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected raw-diff output to be empty when file_output_only=true, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: raw-diff output is empty as expected"

      - name: Assert JSON diff file was still written
        run: |
          if [ ! -f /tmp/file-only-output.json ]; then
            echo "FAIL: JSON diff file was not written even though json_diff_file_output was set"
            exit 1
          fi
          echo "JSON file content:"
          cat /tmp/file-only-output.json
          echo "PASS: JSON diff file was written"

      - name: Assert raw diff file was still written
        run: |
          if [ ! -f /tmp/file-only-output.raw ]; then
            echo "FAIL: raw diff file was not written even though raw_diff_file_output was set"
            exit 1
          fi
          echo "Raw file content:"
          cat /tmp/file-only-output.raw
          echo "PASS: raw diff file was written"
