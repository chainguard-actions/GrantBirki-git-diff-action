name: Test search_path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Create changes in two different directories
      - name: Set up git and create changes in two directories
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          mkdir -p "$GITHUB_WORKSPACE/subdir-a"
          mkdir -p "$GITHUB_WORKSPACE/subdir-b"
          echo "content in subdir-a" > "$GITHUB_WORKSPACE/subdir-a/file-a.txt"
          echo "content in subdir-b" > "$GITHUB_WORKSPACE/subdir-b/file-b.txt"
          git add subdir-a/file-a.txt subdir-b/file-b.txt
          git commit -m "Add files in subdir-a and subdir-b"

      - id: action
        uses: .
        with:
          base_branch: HEAD^1
          search_path: subdir-a

      - name: Assert raw-diff contains subdir-a file
        env:
          ACTUAL: ${{ steps.action.outputs.raw-diff }}
        run: |
          echo "actual raw-diff: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "subdir-a/file-a.txt"; then
            echo "FAIL: expected raw-diff to contain 'subdir-a/file-a.txt'"
            exit 1
          fi
          echo "PASS: raw-diff contains 'subdir-a/file-a.txt'"

      - name: Assert raw-diff does NOT contain subdir-b file
        env:
          ACTUAL: ${{ steps.action.outputs.raw-diff }}
        run: |
          echo "actual raw-diff: $ACTUAL"
          if echo "$ACTUAL" | grep -q "subdir-b/file-b.txt"; then
            echo "FAIL: raw-diff should NOT contain 'subdir-b/file-b.txt' when search_path is 'subdir-a'"
            exit 1
          fi
          echo "PASS: raw-diff does not contain 'subdir-b/file-b.txt'"

      - name: Assert json-diff contains only subdir-a file
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual json-diff: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "subdir-a/file-a.txt"; then
            echo "FAIL: expected json-diff to contain 'subdir-a/file-a.txt'"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "subdir-b/file-b.txt"; then
            echo "FAIL: json-diff should NOT contain 'subdir-b/file-b.txt'"
            exit 1
          fi
          echo "PASS: json-diff correctly scoped to search_path"
