name: Test search_path - limit diff to sub-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Create commits with changes in two different directories
      - name: Setup git user and create commits with changes in subdirectories
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a subdirectory and add a file
          mkdir -p "$GITHUB_WORKSPACE/subdir-a"
          echo "content in subdir-a" > "$GITHUB_WORKSPACE/subdir-a/file-a.txt"
          mkdir -p "$GITHUB_WORKSPACE/subdir-b"
          echo "content in subdir-b" > "$GITHUB_WORKSPACE/subdir-b/file-b.txt"

          git add "$GITHUB_WORKSPACE/subdir-a/file-a.txt" "$GITHUB_WORKSPACE/subdir-b/file-b.txt"
          git commit -m "test: add files in subdir-a and subdir-b"

      - id: action
        uses: .
        with:
          base_branch: HEAD^1
          search_path: subdir-a

      - name: Assert json-diff contains subdir-a file
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual json-diff: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: json-diff output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q 'subdir-a'; then
            echo "FAIL: json-diff does not contain 'subdir-a'"
            exit 1
          fi
          echo "PASS: json-diff contains subdir-a"

      - name: Assert json-diff does NOT contain subdir-b file
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual json-diff: $ACTUAL"
          if echo "$ACTUAL" | grep -q 'subdir-b'; then
            echo "FAIL: json-diff contains 'subdir-b' but search_path was limited to subdir-a"
            exit 1
          fi
          echo "PASS: json-diff does not contain subdir-b (search_path correctly limited)"

      - name: Cleanup test directories
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/subdir-a" "$GITHUB_WORKSPACE/subdir-b" || true
