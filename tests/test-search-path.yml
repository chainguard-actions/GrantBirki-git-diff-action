name: Test search_path limiting diff scope
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user and create commits with changes in different paths
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create files in two different directories
          mkdir -p "$GITHUB_WORKSPACE/subdir-a" "$GITHUB_WORKSPACE/subdir-b"
          echo "content in subdir-a" > "$GITHUB_WORKSPACE/subdir-a/file-a.txt"
          echo "content in subdir-b" > "$GITHUB_WORKSPACE/subdir-b/file-b.txt"
          git add "$GITHUB_WORKSPACE/subdir-a/file-a.txt" "$GITHUB_WORKSPACE/subdir-b/file-b.txt"
          git commit -m "Add files in subdir-a and subdir-b"

      - id: action
        uses: .
        with:
          base_branch: HEAD^1
          search_path: subdir-a

      - name: Assert json-diff contains subdir-a file
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected json-diff output to be non-empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q 'file-a.txt'; then
            echo "FAIL: expected json-diff to contain 'file-a.txt'"
            exit 1
          fi
          echo "PASS: json-diff contains file-a.txt from subdir-a"

      - name: Assert json-diff does NOT contain subdir-b file
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q 'file-b.txt'; then
            echo "FAIL: json-diff should NOT contain 'file-b.txt' when search_path=subdir-a"
            exit 1
          fi
          echo "PASS: json-diff correctly excludes file-b.txt from subdir-b"

      - name: Clean up test directories
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/subdir-a" "$GITHUB_WORKSPACE/subdir-b"
