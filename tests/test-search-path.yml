name: Test search path filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create commits with files in different directories
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          mkdir -p subdir-alpha subdir-beta
          echo "alpha content" > subdir-alpha/alpha.txt
          echo "beta content" > subdir-beta/beta.txt
          git add subdir-alpha/alpha.txt subdir-beta/beta.txt
          git commit -m "Add files in subdir-alpha and subdir-beta"

      - id: action
        uses: .
        with:
          base_branch: HEAD^1
          search_path: subdir-alpha

      - name: Assert json-diff contains only subdir-alpha files
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual json-diff: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected json-diff to be non-empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "alpha"; then
            echo "FAIL: expected json-diff to contain 'alpha'"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "beta"; then
            echo "FAIL: expected json-diff NOT to contain 'beta' (outside search_path)"
            exit 1
          fi
          echo "PASS: json-diff contains alpha but not beta"

      - name: Assert raw-diff contains only subdir-alpha files
        env:
          ACTUAL: ${{ steps.action.outputs.raw-diff }}
        run: |
          echo "actual raw-diff: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected raw-diff to be non-empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "alpha"; then
            echo "FAIL: expected raw-diff to contain 'alpha'"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "beta"; then
            echo "FAIL: expected raw-diff NOT to contain 'beta' (outside search_path)"
            exit 1
          fi
          echo "PASS: raw-diff contains alpha but not beta"
