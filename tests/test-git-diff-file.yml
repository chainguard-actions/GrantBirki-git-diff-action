name: Test git_diff_file input (read diff from file)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a fake diff file inside the workspace
        run: |
          # The file MUST be inside GITHUB_WORKSPACE - resolveWorkspacePath enforces this
          # Use printf to write a proper git diff format without heredoc indentation issues
          printf '%s\n' \
            'diff --git a/fake-file.txt b/fake-file.txt' \
            'new file mode 100644' \
            'index 0000000..8ab686e' \
            '--- /dev/null' \
            '+++ b/fake-file.txt' \
            '@@ -0,0 +1 @@' \
            '+hello from fake diff' \
            > "$GITHUB_WORKSPACE/my-diff.patch"
          echo "Created diff file:"
          cat "$GITHUB_WORKSPACE/my-diff.patch"

      - id: action
        uses: .
        with:
          git_diff_file: my-diff.patch

      - name: Assert json-diff is non-empty when reading from file
        env:
          JSON_DIFF: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "json-diff: $JSON_DIFF"
          if [ -z "$JSON_DIFF" ]; then
            echo "FAIL: json-diff output is empty when reading from diff file"
            exit 1
          fi
          echo "PASS: json-diff is non-empty"

      - name: Assert raw-diff is non-empty when reading from file
        env:
          RAW_DIFF: ${{ steps.action.outputs.raw-diff }}
        run: |
          echo "raw-diff: $RAW_DIFF"
          if [ -z "$RAW_DIFF" ]; then
            echo "FAIL: raw-diff output is empty when reading from diff file"
            exit 1
          fi
          echo "PASS: raw-diff is non-empty"

      - name: Assert json-diff contains fake-file.txt from the diff file
        env:
          JSON_DIFF: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "json-diff: $JSON_DIFF"
          if ! echo "$JSON_DIFF" | grep -q "fake-file.txt"; then
            echo "FAIL: json-diff does not contain fake-file.txt from the diff file"
            exit 1
          fi
          echo "PASS: json-diff contains fake-file.txt"
