name: Test git_diff_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Create a pre-existing diff file to read from
      - name: Create a sample diff file
        run: |
          cat > "$GITHUB_WORKSPACE/sample.diff" << 'EOF'
          diff --git a/foo.txt b/foo.txt
          new file mode 100644
          index 0000000..3b18e51
          --- /dev/null
          +++ b/foo.txt
          @@ -0,0 +1 @@
          +hello world
          EOF

      - id: action
        uses: .
        with:
          git_diff_file: sample.diff

      - name: Assert raw-diff is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.raw-diff }}
        run: |
          echo "actual raw-diff: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected raw-diff to be non-empty"
            exit 1
          fi
          echo "PASS: raw-diff is non-empty"

      - name: Assert json-diff is valid JSON
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual json-diff: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected json-diff to be non-empty"
            exit 1
          fi
          echo "$ACTUAL" | python3 -c "import sys, json; d=json.load(sys.stdin); print('parsed OK, files:', len(d.get('files', [])))"
          if [ $? -ne 0 ]; then
            echo "FAIL: json-diff is not valid JSON"
            exit 1
          fi
          echo "PASS: json-diff is valid JSON"

      - name: Assert json-diff contains foo.txt
        env:
          ACTUAL: ${{ steps.action.outputs.json-diff }}
        run: |
          echo "actual json-diff: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "foo.txt"; then
            echo "FAIL: expected json-diff to contain 'foo.txt'"
            exit 1
          fi
          echo "PASS: json-diff contains 'foo.txt'"
